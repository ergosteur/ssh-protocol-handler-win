name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Build ssh-handler (Rust)
      working-directory: SshHandlerRs
      run: cargo build --release --target x86_64-pc-windows-msvc

    - name: Ensure Unix Line Endings for Shell Script
      shell: pwsh
      run: |
        $path = "ssh-handler.sh"
        if (Test-Path $path) {
            $content = [System.IO.File]::ReadAllText((Get-Item $path).FullName)
            $content = $content -replace "`r`n", "`n"
            [System.IO.File]::WriteAllText((Get-Item $path).FullName, $content, (New-Object System.Text.UTF8Encoding($false)))
        }

    - name: Prepare Assets with Versioning
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        if (-not $tag -or $tag -eq "main") { $tag = "manual" }
        # Branch names (workflow_dispatch) can contain "/", which breaks file paths.
        $tag = $tag -replace '[\\/]', '-'

        # Rename Rust executable
        Move-Item SshHandlerRs/target/x86_64-pc-windows-msvc/release/ssh-handler.exe "./ssh-handler-rs-$tag.exe"

        # Rename Scripts
        Copy-Item "ssh-handler.sh" "./ssh-handler-$tag.sh"
        Copy-Item "openssh_protocol_handler.bat" "./openssh_protocol_handler-$tag.bat"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ssh-handler-rs-*.exe
          ssh-handler-*.sh
          openssh_protocol_handler-*.bat
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
